<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP Data Logger Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-light: #f8fafc;
            --bg-dark: #0f172a;
            --card-light: rgba(255, 255, 255, 0.8);
            --card-dark: rgba(30, 41, 59, 0.7);
            --text-light: #1e293b;
            --text-dark: #f8fafc;
            --border-light: rgba(226, 232, 240, 0.8);
            --border-dark: rgba(51, 65, 85, 0.5);
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-main: var(--bg-dark);
            --bg-card: var(--card-dark);
            --text-main: var(--text-dark);
            --border-main: var(--border-dark);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] {
            --bg-main: var(--bg-light);
            --bg-card: var(--card-light);
            --text-main: var(--text-light);
            --border-main: var(--border-main);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            transition: var(--transition);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 1000;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary);
        }

        .nav-actions {
            display: flex;
            gap: 12px;
        }

        .btn-icon {
            background: none;
            border: 1px solid var(--border-main);
            color: var(--text-main);
            padding: 8px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: var(--transition);
        }

        .btn-icon:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 70px;
            bottom: 0;
            width: 260px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-main);
            padding: 24px 16px;
            transform: translateX(-100%);
            transition: var(--transition);
            z-index: 999;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            text-decoration: none;
            color: var(--text-main);
            border-radius: 12px;
            margin-bottom: 8px;
            transition: var(--transition);
            opacity: 0.7;
            cursor: pointer;
        }

        .nav-link:hover,
        .nav-link.active {
            background: var(--primary);
            color: white;
            opacity: 1;
        }

        .main-content {
            margin-top: 70px;
            padding: 32px;
            transition: var(--transition);
        }

        @media (min-width: 1024px) {
            .sidebar {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 260px;
            }

            .drawer-toggle {
                display: none;
            }
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-main);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .stat-label {
            font-size: 0.875rem;
            font-weight: 600;
            opacity: 0.6;
            margin-bottom: 8px;
            display: block;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-main);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 24px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .table-wrapper {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 500px;
            border-radius: 16px;
            border: 1px solid var(--border-main);
        }

        .analytics-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .chart-container {
            width: 100%;
            height: 300px;
            margin-bottom: 32px;
            position: relative;
        }

        .analytics-item {
            padding: 16px;
            border-radius: 16px;
            background: rgba(99, 102, 241, 0.03);
            border: 1px solid var(--border-main);
        }

        .time-label {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            display: block;
        }

        .event-tally {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .table-wrapper::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--border-main);
            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 5;
            padding: 16px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--border-main);
        }

        [data-theme="dark"] th {
            background: rgba(30, 41, 59, 0.95);
        }

        [data-theme="light"] th {
            background: rgba(255, 255, 255, 0.95);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-main);
            font-size: 0.9rem;
        }

        tr:hover td {
            background: rgba(99, 102, 241, 0.05);
        }

        .pill {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
        }

        .pill-true {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .pill-false {
            background: rgba(244, 63, 94, 0.15);
            color: #f43f5e;
        }

        .refreshing-spinner {
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .view-hidden {
            display: none !important;
        }

        @media (max-width: 640px) {
            .main-content {
                padding: 16px;
            }

            .stat-card {
                padding: 16px;
            }

            .table-wrapper {
                max-height: 400px;
            }
        }
    </style>
</head>

<body data-theme="light">

    <header class="header">
        <div class="logo-section">
            <button class="btn-icon drawer-toggle" onclick="toggleSidebar()">
                <span class="material-icons-round">menu</span>
            </button>
            <span class="material-icons-round" style="font-size: 32px;">sensors</span>
            <span>ESP-Logger</span>
        </div>

        <div class="nav-actions">
            <button class="btn-icon" onclick="loadData()" id="refresh-btn">
                <span class="material-icons-round">refresh</span>
            </button>
            <button class="btn-icon" onclick="toggleTheme()" id="theme-btn">
                <span class="material-icons-round">dark_mode</span>
            </button>
        </div>
    </header>

    <aside class="sidebar" id="sidebar">
        <nav>
            <div onclick="switchView('dashboard')" class="nav-link active" id="nav-dashboard">
                <span class="material-icons-round">dashboard</span>
                <span>Dashboard</span>
            </div>
            <div onclick="switchView('analytics')" class="nav-link" id="nav-analytics">
                <span class="material-icons-round">analytics</span>
                <span>Analytics</span>
            </div>
        </nav>
    </aside>

    <main class="main-content">

        <div id="view-dashboard">
            <div class="glass-panel">
                <div class="panel-header">
                    <h2 style="font-weight: 700; font-size: 1.25rem;">Sensor Set 1</h2>
                    <span style="font-size: 0.8rem; opacity: 0.6;" id="last-updated-1">Updating...</span>
                </div>
                <div class="metrics-grid" style="margin-bottom: 24px;">
                    <div class="stat-card">
                        <span class="stat-label">Distance</span>
                        <div class="stat-value" id="val-dist-1">-- cm</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Presence</span>
                        <div class="stat-value" id="val-presence-1">--</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Loiter</span>
                        <div class="stat-value" id="val-loiter-1">--</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Sound</span>
                        <div class="stat-value" id="val-sound-1">--</div>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>State</th>
                                <th>Distance</th>
                                <th>PIR</th>
                                <th>Presence</th>
                                <th>Sound</th>
                                <th>Loiter</th>
                            </tr>
                        </thead>
                        <tbody id="data-body-1">
                            <tr>
                                <td colspan="7" style="text-align: center; padding: 40px;">
                                    <div style="opacity: 0.4">No data</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-analytics" class="view-hidden">
            <div class="panel-header">
                <h1 style="margin-bottom: 0;">Activity Analytics</h1>
            </div>

            <div class="metrics-grid">
                <div class="stat-card" style="grid-column: span 2">
                    <span class="stat-label">Loiter & Static Event Trends</span>
                    <div class="chart-container">
                        <canvas id="eventChart"></canvas>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Distance Over Time</span>
                    <div class="chart-container">
                        <canvas id="distanceChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="glass-panel">
                <div class="panel-header">
                    <h2 style="font-weight: 700; font-size: 1.25rem;">Event Summary</h2>
                </div>

                <div id="analytics-content" class="analytics-group">
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; opacity: 0.5;">
                        Loading activity reports...
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        const state = {
            theme: localStorage.getItem('theme') || 'light',
            isSidebarOpen: false,
            currentView: 'dashboard',
            rawData: [],
            charts: {
                event: null,
                distance: null
            }
        };

        function switchView(viewName) {
            state.currentView = viewName;

            document.getElementById('view-dashboard').classList.toggle('view-hidden', viewName !== 'dashboard');
            document.getElementById('view-analytics').classList.toggle('view-hidden', viewName !== 'analytics');

            document.getElementById('nav-dashboard').classList.toggle('active', viewName === 'dashboard');
            document.getElementById('nav-analytics').classList.toggle('active', viewName === 'analytics');

            if (viewName === 'analytics') {
                setTimeout(() => renderAnalytics(), 100);
            }
        }

        function toggleTheme() {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', state.theme);
            localStorage.setItem('theme', state.theme);
            updateThemeUI();
            if (state.currentView === 'analytics') renderAnalytics();
        }

        function updateThemeUI() {
            const btn = document.getElementById('theme-btn').querySelector('span');
            btn.textContent = state.theme === 'light' ? 'dark_mode' : 'light_mode';
        }

        function toggleSidebar() {
            state.isSidebarOpen = !state.isSidebarOpen;
            document.getElementById('sidebar').classList.toggle('active', state.isSidebarOpen);
        }

        function formatPhilippineTime(timestamp) {
            if (!timestamp) return '--:--';
            const parts = timestamp.split(/[- :]/);
            const hours = parseInt(parts[3], 10);
            const minutes = parseInt(parts[4], 10);
            if (isNaN(hours) || isNaN(minutes)) return '--:--';
            const ampm = hours >= 12 ? 'PM' : 'AM';
            const displayHours = hours % 12 || 12;
            const displayMinutes = minutes.toString().padStart(2, '0');
            return `${displayHours}:${displayMinutes} ${ampm}`;
        }

        function renderAnalytics() {
            console.log('renderAnalytics called, data count:', state.rawData.length);
            
            const container = document.getElementById('analytics-content');

            if (!state.rawData.length) {
                container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px;">No data available.</div>`;
                return;
            }

            const sortedData = [...state.rawData].sort((a, b) => {
                const timeA = new Date(a.timestamp.replace(' ', 'T') + 'Z').getTime();
                const timeB = new Date(b.timestamp.replace(' ', 'T') + 'Z').getTime();
                return timeA - timeB;
            });

            const totalLoiters = sortedData.filter(r => r.buzzer_active === 'yes').length;
            const totalStaticEvents = sortedData.filter(r => r.state === 'LOITER' || r.state === 'OBSTACLE').length;
            const avgDistance = sortedData.reduce((sum, r) => sum + r.distance, 0) / sortedData.length;

            container.innerHTML = `
                <div class="analytics-item">
                    <span class="time-label">Total Records</span>
                    <div class="event-tally">
                        <span>Data Points</span>
                        <span style="font-weight:700">${sortedData.length}</span>
                    </div>
                    <div class="event-tally">
                        <span>Loiter Events</span>
                        <span style="font-weight:700">${totalLoiters}</span>
                    </div>
                    <div class="event-tally">
                        <span>Avg. Distance</span>
                        <span>${avgDistance.toFixed(1)} cm</span>
                    </div>
                    <div style="height:4px; width:100%; background:var(--border-main); border-radius:2px; margin-top:8px; overflow:hidden">
                        <div style="height:100%; width:100%; background:var(--primary)"></div>
                    </div>
                </div>
            `;

            updateCharts(sortedData);
        }

        function updateCharts(sortedData) {
            const labels = sortedData.map(r => formatPhilippineTime(r.timestamp));
            
            const loiterData = sortedData.map(r => r.buzzer_active === 'yes' ? 1 : 0);
            const staticData = sortedData.map(r => (r.state === 'LOITER' || r.state === 'OBSTACLE') ? 1 : 0);
            const distanceData = sortedData.map(r => r.distance);

            const isDark = state.theme === 'dark';
            const textColor = isDark ? '#f8fafc' : '#1e293b';
            const gridColor = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.05)';

            if (state.charts.event) state.charts.event.destroy();
            state.charts.event = new Chart(document.getElementById('eventChart'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: 'Loiter Alert',
                            data: loiterData,
                            borderColor: '#6366f1',
                            backgroundColor: 'rgba(99, 102, 241, 0.1)',
                            fill: true,
                            tension: 0.2,
                            borderWidth: 2,
                            pointRadius: 2,
                            pointBackgroundColor: '#6366f1'
                        },
                        {
                            label: 'Static Events',
                            data: staticData,
                            borderColor: '#10b981',
                            borderDash: [5, 5],
                            tension: 0.2,
                            borderWidth: 2,
                            pointRadius: 2,
                            pointBackgroundColor: '#10b981'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: textColor, font: { family: 'Plus Jakarta Sans' } } }
                    },
                    scales: {
                        x: { 
                            grid: { color: gridColor }, 
                            ticks: { color: textColor, maxRotation: 45, minRotation: 45 } 
                        },
                        y: { 
                            grid: { color: gridColor }, 
                            ticks: { color: textColor },
                            beginAtZero: true,
                            max: 2
                        }
                    }
                }
            });

            if (state.charts.distance) state.charts.distance.destroy();
            state.charts.distance = new Chart(document.getElementById('distanceChart'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'Distance (cm)',
                        data: distanceData,
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        fill: true,
                        tension: 0.2,
                        borderWidth: 2,
                        pointRadius: 2,
                        pointBackgroundColor: '#6366f1'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { 
                            grid: { display: false }, 
                            ticks: { color: textColor, maxRotation: 45, minRotation: 45 } 
                        },
                        y: { 
                            grid: { color: gridColor }, 
                            ticks: { color: textColor },
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        async function loadData() {
            const refreshBtn = document.getElementById('refresh-btn');
            refreshBtn.classList.add('refreshing-spinner');

            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                state.rawData = data;
                renderDashboardUI(data);
                if (state.currentView === 'analytics') renderAnalytics();
            } catch (error) {
                console.error('Data sync failed:', error);
            } finally {
                setTimeout(() => refreshBtn.classList.remove('refreshing-spinner'), 600);
            }
        }

        function renderDashboardUI(data) {
            if (!data || data.length === 0) {
                document.getElementById('data-body-1').innerHTML = `<tr><td colspan="7" style="text-align:center; padding:40px;">No sensor data found</td></tr>`;
                return;
            }

            const data1 = data.filter(row => row.set == 1);

            if (data1.length > 0) {
                const latest1 = data1[0];
                document.getElementById('val-dist-1').textContent = `${latest1.distance} cm`;
                document.getElementById('val-presence-1').innerHTML = latest1.pir ?
                    `<span style="color:var(--accent-success)">ACTIVE</span>` : `<span>IDLE</span>`;
                document.getElementById('val-loiter-1').textContent = latest1.buzzer_active === 'yes' ? 1 : 0;
                document.getElementById('val-sound-1').textContent = latest1.sound_level || 0;
                document.getElementById('last-updated-1').textContent = `Last sync: ${new Date().toLocaleTimeString()}`;

                const sortedData1 = [...data1].sort((a, b) => {
                    const timeA = new Date(a.timestamp.replace(' ', 'T') + 'Z').getTime();
                    const timeB = new Date(b.timestamp.replace(' ', 'T') + 'Z').getTime();
                    return timeB - timeA;
                });

                document.getElementById('data-body-1').innerHTML = sortedData1.slice(0, 10).map(row => {
                    const buzzerActive = row.buzzer_active === 'yes';
                    return `
                    <tr>
                        <td style="font-weight:600">${row.timestamp}</td>
                        <td><span class="pill" style="background:rgba(99,102,241,0.1); color:var(--primary)">${row.state}</span></td>
                        <td>${row.distance} cm</td>
                        <td><span class="pill pill-${!!row.pir}">${row.pir ? 'YES' : 'NO'}</span></td>
                        <td><span class="pill pill-${!!row.pir}">${row.pir ? 'YES' : 'NO'}</span></td>
                        <td>${row.sound_level}</td>
                        <td>${buzzerActive ? 'ALARM' : '0'}</td>
                    </tr>
                `}).join('');
            } else {
                document.getElementById('data-body-1').innerHTML = `<tr><td colspan="7" style="text-align:center; padding:40px;">No data for Set 1</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.body.setAttribute('data-theme', state.theme);
            updateThemeUI();
            loadData();
            setInterval(loadData, 15000);
        });

        document.addEventListener('click', (e) => {
            if (window.innerWidth < 1024 && state.isSidebarOpen) {
                if (!e.target.closest('#sidebar') && !e.target.closest('.drawer-toggle')) {
                    toggleSidebar();
                }
            }
        });
    </script>
</body>

</html>
